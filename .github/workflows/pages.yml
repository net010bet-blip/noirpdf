name: Publish tested NoirPDF to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: pip install -r services/api/requirements.txt
      - run: python -m pytest -q
      - name: Build static site with local PDF engines
        run: npm run build
        env:
          NEXT_PUBLIC_PROCESSING_MODE: browser
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - run: npx playwright install --with-deps chromium
      - name: Test all available browser engines
        shell: bash
        run: |
          mkdir -p /tmp/noir-pages/${{ github.event.repository.name }}
          cp -a apps/web/out/. /tmp/noir-pages/${{ github.event.repository.name }}/
          python -m http.server 4173 --bind 127.0.0.1 --directory /tmp/noir-pages > /tmp/pages-server.log 2>&1 &
          PAGES_TEST_URL=http://127.0.0.1:4173/${{ github.event.repository.name }} npx playwright test --config playwright.pages.config.ts
          python scripts/check_browser_outputs.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
